[package]
name = "cargo-plane"
version.workspace = true
edition = "2024"
description = "Cargo, but in the cloud(s): run cargo on a remote machine with pluggable providers (SSH, Fly.io, ...)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/robinvandernoord/cargo-plane"
keywords = ["cargo", "remote", "build", "cloud", "subcommand"]
categories = ["development-tools::cargo-plugins"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[workspace]
members = ["crates/*"]
# Plain `cargo build` and `cargo test` cover the provider plugins too.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.2.2"

[features]
default = ["ssh", "fly", "codespace"]
# Built-in providers. Without one, cargo-plane looks for its plugin binary
# (`cargo-plane-provider-<name>`) on PATH instead.
ssh = ["dep:cargo-plane-provider-ssh"]
fly = ["dep:cargo-plane-provider-fly"]
codespace = ["dep:cargo-plane-provider-codespace"]

[dependencies]
cargo-plane-provider = { version = "0.2.0", path = "crates/cargo-plane-provider" }
cargo-plane-provider-ssh = { version = "0.2.0", path = "crates/cargo-plane-provider-ssh", optional = true }
cargo-plane-provider-fly = { version = "0.2.0", path = "crates/cargo-plane-provider-fly", optional = true }
cargo-plane-provider-codespace = { version = "0.2.0", path = "crates/cargo-plane-provider-codespace", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = { version = "0.9", features = ["preserve_order"] }
