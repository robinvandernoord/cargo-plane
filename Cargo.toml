[package]
name = "cargo-plane"
version = "0.1.0"
edition = "2024"
description = "Cargo, but in the cloud(s): run cargo on a remote machine with pluggable providers (SSH, Fly.io, ...)"
license = "MIT"
readme = "README.md"
keywords = ["cargo", "remote", "build", "cloud", "subcommand"]
categories = ["development-tools::cargo-plugins"]

[workspace]
members = ["crates/*"]

[dependencies]
cargo-plane-provider = { version = "0.1.0", path = "crates/cargo-plane-provider" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = { version = "0.9", features = ["preserve_order"] }
