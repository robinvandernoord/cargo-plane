name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$TARGET"
      - name: Check version
        id: version
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "cargo-plane") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo +stable build --release --locked -p cargo-plane --target "$TARGET"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          "target/$TARGET/release/cargo-plane" --version
          mkdir -p dist
          tar -czf "dist/cargo-plane-$TARGET-v$VERSION.tgz" -C "target/$TARGET/release" cargo-plane -C "$GITHUB_WORKSPACE" LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-plane-${{ matrix.target }}
          path: dist/*.tgz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release assets
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cargo-plane-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
          else
            options=()
            if [[ "$TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$TAG" dist/*.tgz --verify-tag --generate-notes "${options[@]}"
          fi
