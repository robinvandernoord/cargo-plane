[package]
name = "cargo-plane-provider"
version = "0.1.0"
edition = "2024"
description = "Write provider plugins for cargo-plane: start and stop a build machine, say how to reach it"
license = "MIT"
keywords = ["cargo", "remote", "build", "plugin"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
