[package]
name = "cargo-plane-provider-codespace"
version = "0.1.0"
edition = "2024"
description = "cargo-plane provider: a GitHub Codespace, reached through the GitHub CLI"
license = "MIT"
keywords = ["cargo", "remote", "build", "plugin"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
cargo-plane-provider = { version = "0.1.0", path = "../cargo-plane-provider" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
