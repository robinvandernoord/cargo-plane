[package]
name = "cargo-plane-provider-ssh"
version.workspace = true
edition = "2024"
description = "cargo-plane provider: an always-on machine reachable over SSH"
license = "MIT"
keywords = ["cargo", "remote", "build", "plugin"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
cargo-plane-provider = { version = "0.1.0", path = "../cargo-plane-provider" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

